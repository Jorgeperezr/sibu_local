# Proxy de producción. Termina TLS y pasa a gunicorn.
#
# Las tres cabeceras `X-Forwarded-*` no son adorno: sin `X-Forwarded-Proto`,
# Django cree que la petición llegó por HTTP —`SECURE_PROXY_SSL_HEADER` la
# lee— y entra en un bucle de redirección con `SECURE_SSL_REDIRECT`.

upstream sibu {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Let's Encrypt valida por aquí; el resto sube a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # `http2 on;` exige nginx >= 1.25, que es la imagen fijada en el compose.
    # En una versión anterior la directiva no existe y nginx no arranca.
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # La carga de la base institucional sube un Excel de miles de filas; el
    # límite de nginx por omisión (1 MB) la rechazaría con un 413 antes de
    # llegar a Django, que sí acepta 16 MB.
    client_max_body_size 20M;

    # Los estáticos los sirve WhiteNoise desde la propia aplicación: van con
    # hash en el nombre y cabecera de caché larga, así que no hace falta
    # duplicar aquí su ruta y arriesgarse a servir una versión vieja.
    location /media/ {
        alias /var/www/media/;
        # Lo subido por usuarios no se ejecuta ni se abre en el navegador.
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition "attachment";
    }

    location / {
        proxy_pass http://sibu;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
